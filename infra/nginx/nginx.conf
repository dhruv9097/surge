worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 30s;
  keepalive_requests 10000;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;

  # Docker's embedded DNS; re-resolved so scaled replicas join the pool
  # without an Nginx reload.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream booking_api {
    zone booking_api 64k;
    server booking-api:3000 resolve max_fails=3 fail_timeout=5s;
    keepalive 256;
  }

  server {
    listen 80 reuseport;

    location = /nginx-health {
      return 200 "ok\n";
    }

    # Internal endpoints are scraped over the Docker network, never exposed.
    location = /metrics { return 404; }
    location /health/ { return 404; }

    location / {
      proxy_pass http://booking_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      proxy_send_timeout 10s;
      # Retry only on connection failures, and only for idempotent methods.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 2s;

      add_header X-Request-Id $request_id always;
    }
  }
}
